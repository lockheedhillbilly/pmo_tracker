[project]
name = "pmo-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "openpyxl>=3.1",
    "tzdata>=2024.1",
    "libsql-client>=0.3.1",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]
# truststore is Windows-only (see requirements.txt) — Vercel runs on Linux,
# so it's deliberately left out of this dependency list entirely.

[tool.vercel]
entrypoint = "dashboard:app"

[tool.vercel.scripts]
build = "python build_vercel.py"
