[project]
name = "pmo-tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "tzdata>=2024.1",
    "libsql-client>=0.3.1",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "truststore>=0.9",
]

[tool.vercel]
entrypoint = "dashboard:app"

[tool.vercel.scripts]
build = "python build_vercel.py"
